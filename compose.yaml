# LANtern needs to see the LAN (ARP, ping), so the container uses the host network.
# Linux only: Docker Desktop (Windows, macOS) has no real host network.
services:
  lantern:
    build: .
    container_name: lantern
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      # a named volume by default; LANTERN_DATA=/srv/lantern (or ./data) makes it a host folder
      - ${LANTERN_DATA:-lantern-data}:/data
    cap_drop: [ALL]
    cap_add: [NET_RAW]  # ping
    security_opt: ["no-new-privileges:true"]

  # Optional search engine for the Identify button: docker compose --profile searxng up -d
  # Then in LANtern: user menu > Search engine > SearXNG (http://127.0.0.1:8888, the default).
  searxng:
    image: searxng/searxng:latest
    container_name: lantern-searxng
    profiles: [searxng]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"  # only this machine, LANtern runs on the host network
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-lantern-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  lantern-data:
