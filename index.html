<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANtern</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f7f8fc;--surface:#fff;--surface2:#eef0f8;--on:#1b1b21;--on2:#5b5e70;--line:#d9dbe6;
  --primary:#3f51b5;--on-primary:#fff;--pc:#dfe3ff;--ok:#1b8a4b;--okc:#d4f3e0;--bad:#ba1a1a;--badc:#ffdad6;
  --warn:#9a5b00;--warnc:#ffe9c2;--shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111318;--surface:#1b1d24;--surface2:#262932;--on:#e3e2e9;--on2:#a9abb9;--line:#363946;
  --primary:#b8c3ff;--on-primary:#0b1b6b;--pc:#2c3470;--ok:#6ddc98;--okc:#0f3a22;--bad:#ffb4ab;--badc:#5c1410;
  --warn:#ffc46b;--warnc:#4a3000;--shadow:0 1px 3px rgba(0,0,0,.5);}}
:root[data-theme=dark]{
  --bg:#111318;--surface:#1b1d24;--surface2:#262932;--on:#e3e2e9;--on2:#a9abb9;--line:#363946;
  --primary:#b8c3ff;--on-primary:#0b1b6b;--pc:#2c3470;--ok:#6ddc98;--okc:#0f3a22;--bad:#ffb4ab;--badc:#5c1410;
  --warn:#ffc46b;--warnc:#4a3000;--shadow:0 1px 3px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on);font-family:Roboto,system-ui,sans-serif;font-size:var(--fs,14px);line-height:1.45}
svg.i{width:1.43em;height:1.43em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 16px;min-height:60px;background:var(--surface);box-shadow:var(--shadow)}
header h1{min-width:0;font-size:1.43em;font-weight:500;margin:0;flex:none;display:flex;align-items:center;gap:10px}
header h1 svg{color:var(--primary)}
.icon-btn{border:0;background:none;color:var(--on2);width:2.8em;height:2.8em;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}
.icon-btn:hover{background:var(--surface2);color:var(--on)}
.icon-btn.spin svg{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
main{max-width:1800px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:2px solid transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}.stat[aria-pressed=true]{border-color:var(--primary);background:var(--pc)}.stat:disabled{opacity:.55;cursor:default}
.stat b{display:block;font-size:28px;font-weight:500}.stat span{color:var(--on2)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sbar{flex-wrap:nowrap;justify-content:center}.search{margin:0;flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:28px;padding:0 6px 0 16px;height:38px;color:var(--on2)}.search .icon-btn{width:28px;height:28px;flex:none}.icon-btn.go{background:var(--primary);color:var(--on-primary);width:38px;height:38px;flex:none}
.search input{flex:1;padding:0;margin:0;width:auto;border:0;background:none;color:var(--on);font:inherit;outline:0}
.chip{border:1px solid var(--line);background:none;color:var(--on);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.chip{color:var(--on);text-decoration:none;display:inline-flex;align-items:center;gap:6px}.chip svg.i{width:1.3em;height:1.3em}.chip small{color:var(--on2)}
.chip[aria-pressed=true]{background:var(--pc);border-color:transparent}
.card{container-type:inline-size;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--on2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface2)}
.mono{font-family:ui-monospace,monospace;font-size:13px}
.name{display:flex;align-items:center;gap:10px}
.ti{width:2.6em;height:2.6em;border-radius:50%;background:var(--pc);color:var(--primary);display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:2px 10px;font-size:12px;font-weight:500}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{color:var(--ok);background:var(--okc)}.pill.off{color:var(--bad);background:var(--badc)}
.pill.conflict{color:var(--warn);background:var(--warnc)}.pill.na{color:var(--on2);background:var(--surface2)}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--on2)}
.tag.f{background:var(--okc);color:var(--ok);border-color:transparent}.tag.r{background:var(--pc);color:var(--primary);border-color:transparent}
.ports{display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
.ti.sm{width:1.9em;height:1.9em}.ti.sm svg{width:1.1em;height:1.1em}
.crow{display:flex;align-items:center;gap:10px;padding:4px 0}.crow .cl{flex:1}.crow small{color:var(--on2)}
.kprev{display:flex;align-items:center;gap:10px;margin-bottom:12px}.kprev input{width:3em;height:2.4em;padding:0;border:0;background:none}
.cpal{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.cdot{width:1.7em;height:1.7em;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.cdot:hover{transform:scale(1.12)}
.cdot[aria-pressed=true]{border-color:var(--on);box-shadow:inset 0 0 0 2px var(--surface)}
label.fam{display:flex;align-items:flex-start;gap:8px;margin-top:8px;color:var(--on)}label.fam input{width:auto;padding:0;margin:3px 0 0}details.look{margin:6px 0 12px}details.look summary{cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--on2)}details.look[open] summary{margin-bottom:10px}
dialog.run{width:min(380px,92vw);text-align:center;padding:28px 24px}dialog.run::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
dialog.run h3{margin:8px 0 4px;font-weight:500;font-size:1.2em}dialog.run p{margin:0 0 6px;color:var(--on2)}.rtime{font-variant-numeric:tabular-nums;color:var(--on2);min-height:1.4em}
.lant{width:130px;height:130px;overflow:visible}
.lant .swing{transform-origin:64px 24px;animation:lsw 2.6s ease-in-out infinite alternate}
.lant .flame{transform-origin:64px 96px;animation:lfl 1.1s ease-in-out infinite alternate}
.lant .glow{animation:lgl 1.6s ease-in-out infinite alternate}
.lant .ray{opacity:0;animation:lry 1.8s ease-out infinite}.lant .ray.o{animation-delay:.5s}
@keyframes lsw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes lfl{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.1) skewX(3deg)}}
@keyframes lgl{from{opacity:.35;transform:scale(.92)}to{opacity:.8;transform:scale(1.04)}}
@keyframes lry{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.run.done .lant *{animation:none!important}.run.done .lant .ray{opacity:.5}
@media (prefers-reduced-motion:reduce){.lant *{animation:none!important}.lant .ray{opacity:.5}}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.8em,1fr));gap:4px;max-height:13em;overflow:auto;margin-bottom:8px}
.ib{border:1px solid var(--line);background:none;color:var(--on);border-radius:8px;padding:.5em;cursor:pointer;display:grid;place-items:center}.ib[aria-pressed=true]{background:var(--pc);border-color:var(--primary);color:var(--primary)}
.chip.desc svg{transform:scaleY(-1)}.chip:disabled{opacity:.6;cursor:default}.chip.spin svg{animation:s 1s linear infinite}
.notes{color:var(--on2);max-width:280px}
.fab{position:fixed;right:24px;bottom:24px;height:56px;padding:0 20px;border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:10px;font:500 14px inherit;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
dialog{border:0;border-radius:24px;padding:24px;width:min(480px,94vw);background:var(--surface);color:var(--on)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 16px;font-weight:500;font-size:22px}
label{display:block;margin-bottom:12px;color:var(--on2);font-size:12px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--on);font:inherit}
label input:focus,label select:focus,label textarea:focus{outline:2px solid var(--primary);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;color:var(--on)}.chk input{width:auto;margin:0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{border:0;border-radius:20px;padding:10px 20px;font:500 14px inherit;cursor:pointer;background:none;color:var(--primary)}
.btn.f{background:var(--primary);color:var(--on-primary)}
#err{color:var(--bad);min-height:20px}
.fs{font-weight:600;font-size:1em;width:2.4em;height:2.4em}
/* niente scroll orizzontale: prima si nascondono colonne secondarie, poi le righe diventano schede */
@container (max-width:118em){th:nth-child(5),td:nth-child(5){display:none}}
@container (max-width:104em){th:nth-child(6),td:nth-child(6){display:none}}
@media (max-width:1100px){.lbl{display:none}}
@container (max-width:90em){th:nth-child(9),td:nth-child(9){display:none}}
@container (max-width:62em){
  thead{display:none}table,tbody,tr,td:nth-child(n){display:block}
  tr{padding:12px 14px;border-bottom:1px solid var(--line)}tr:last-child{border-bottom:0}
  td:nth-child(n){border:0;padding:3px 0}.ports,.notes{max-width:none}
}
.lang{position:relative}
.menu{position:absolute;right:0;top:100%;background:var(--surface);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:6px;z-index:10;min-width:10em}
.menu[hidden]{display:none}
.menu.themes{min-width:19em;max-height:min(70vh,32em);overflow-y:auto}.menu.themes button{justify-content:space-between;white-space:nowrap}svg.sw{width:86px;height:22px;flex:none}#theme{width:auto;padding:0 6px}#theme svg.sw{width:62px;height:16px}
.hl,.hr{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}.hr{margin-left:auto}.hl .menu{left:0;right:auto}
.menu button,.menu a{text-decoration:none;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--on);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}
.menu button:hover,.menu a:hover,.menu button[aria-pressed=true]{background:var(--surface2)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}#umenu{min-width:17em}.menu [hidden],.search [hidden]{display:none}
@media (max-width:700px){header{position:static;padding:8px 12px}header h1{flex:1 1 100%;font-size:1.2em}.hl,.hr{flex:1 1 100%;justify-content:space-between}.hl{justify-content:flex-start}#ts{display:none}.hr .chip{padding:6px 10px}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:8px 10px;border-radius:12px}.stat b{font-size:22px}.stat span{font-size:.8em}main{padding-bottom:84px}.fab{right:16px;bottom:16px;padding:0 16px}.fab span{display:none}}
.flag{width:2em;height:1.4em;border-radius:3px;box-shadow:0 0 0 1px var(--line);display:block}
header h1 small{font-size:.5em;font-weight:400;color:var(--on2);margin-left:6px}
@media (max-width:1400px){header h1 small{display:none}}
.sug{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--pc);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.sug[hidden]{display:none}
.rrow,.radd{display:grid;grid-template-columns:1.2fr 1.4fr 1.2fr auto;gap:6px;margin-bottom:6px;align-items:center}
.rrow select,.rrow input,.radd select,.radd input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--on);font:inherit;min-width:0;width:100%}
#rlist{max-height:40vh;overflow:auto;margin:10px 0}
#rdlg,#bdlg,#pdlg{width:min(720px,96vw)}
#pl{width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:.9em;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--on)}
.brow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;margin-bottom:6px}.brow small{color:var(--on2);display:block}
.brow input,.bnew input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--on);font:inherit;min-width:0;width:100%}
.bnew{display:grid;grid-template-columns:1fr auto;gap:6px;margin:10px 0}
#blist{max-height:45vh;overflow:auto;margin:10px 0}
a.icon-btn{display:inline-flex;align-items:center;justify-content:center;color:inherit}
.oui{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--on2)}.oui span{flex:1}
.ouiurls{display:grid;gap:4px;font-size:.86em;color:var(--on2);margin-top:12px}.ouiurls textarea{font:inherit;font-family:ui-monospace,monospace;font-size:.9em;padding:8px;border-radius:8px;border:1px solid var(--line,var(--on2));background:transparent;color:var(--on);resize:vertical;width:100%;box-sizing:border-box}
.icon-btn[aria-pressed=true]{color:var(--primary)}
header h1 .ver{font-size:.45em;font-weight:400;color:var(--on2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:-2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<header>
  <h1><img src="/logo.svg" alt="" width="34" height="34">LANtern<span class="ver">v{{VERSION}}</span><small data-i="app.tag"></small></h1>
  <div class="hl">
    <div class="lang"><button class="icon-btn" id="theme" data-it="theme"></button><div class="menu themes" id="tmenu" hidden></div></div>
    <button class="icon-btn fs" id="fsm" data-it="fs.m">A-</button>
    <button class="icon-btn fs" id="fsp" data-it="fs.p">A+</button>
    <button class="icon-btn fs" id="fsr" data-it="fs.r">↺</button>
    <div class="lang"><button class="icon-btn" id="langbtn" data-it="lang"></button><div class="menu" id="lmenu" hidden></div></div>
  </div>
  <div class="hr">
    <button class="chip" id="discover" data-it="disc.t"><svg class="i" viewBox="0 0 24 24"><use href="#i-radar"/></svg><span class="lbl" data-i="disc"></span></button>
    <button class="chip" id="scanall" data-it="scan.all.t"><svg class="i" viewBox="0 0 24 24"><use href="#i-scan"/></svg><span class="lbl" data-i="scan.all"></span></button>
    <span id="ts" style="color:var(--on2)"></span>
    <button class="icon-btn" id="pause" data-it="auto.pause"><svg class="i" viewBox="0 0 24 24"><use href="#i-pause"/></svg></button>
    <button class="icon-btn" id="refresh" data-it="refresh"><svg class="i" viewBox="0 0 24 24"><use href="#i-refresh"/></svg></button>
    <input type="file" id="impf" accept=".csv,.xml,.txt,text/csv,text/xml" hidden>
    <div class="lang"><button class="icon-btn" id="ubtn" data-it="um.title"><svg class="i" viewBox="0 0 24 24"><use href="#i-user"/></svg></button>
      <div class="menu" id="umenu" hidden>
        <button id="import"><svg class="i" viewBox="0 0 24 24"><use href="#i-upload"/></svg><span data-i="um.imp"></span></button>
        <button id="bkbtn"><svg class="i" viewBox="0 0 24 24"><use href="#i-archive"/></svg><span data-i="bk.title"></span></button>
        <a id="xcsv" href="/api/export.csv" download><svg class="i" viewBox="0 0 24 24"><use href="#i-download"/></svg><span data-i="exp.csv"></span></a>
        <a id="xxlsx" href="/api/export.xlsx" download><svg class="i" viewBox="0 0 24 24"><use href="#i-download"/></svg><span data-i="exp.xlsx"></span></a>
        <hr>
        <button id="acct"><svg class="i" viewBox="0 0 24 24"><use href="#i-user"/></svg><span data-i="um.acct"></span></button>
        <button id="mout" hidden><svg class="i" viewBox="0 0 24 24"><use href="#i-logout"/></svg><span data-i="acct.out"></span></button>
      </div></div>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <form class="bar sbar" id="sform" role="search">
    <label class="search"><input id="q" type="text" autocomplete="off" data-ip="search"><button type="button" class="icon-btn" id="qx" hidden data-it="search.clear"><svg class="i" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></label>
    <button class="icon-btn go" id="qgo" data-it="search.go"><svg class="i" viewBox="0 0 24 24"><use href="#i-search"/></svg></button>
  </form>
  <div class="bar" id="types"></div>
  <div class="card"><table>
    <thead><tr id="head"></tr></thead><tbody id="rows"></tbody>
  </table></div>
</main>
<button class="fab" id="add"><svg class="i" viewBox="0 0 24 24"><use href="#i-plus"/></svg><span data-i="add"></span></button>

<dialog id="rundlg" class="run"><svg class="lant" viewBox="0 0 128 128" aria-hidden="true">
  <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
  <radialGradient id="rgl" cx="64" cy="72" r="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb84d" stop-opacity=".7"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient></defs>
  <circle class="glow" cx="64" cy="72" r="52" fill="url(#rgl)" style="transform-origin:64px 72px"/>
  <g fill="none" stroke="#ffb300" stroke-width="4" stroke-linecap="round">
    <path class="ray" d="M22 54a50 50 0 0 0 0 34"/><path class="ray" d="M106 54a50 50 0 0 1 0 34"/>
    <path class="ray o" d="M10 58a62 62 0 0 0 0 26"/><path class="ray o" d="M118 58a62 62 0 0 1 0 26"/></g>
  <g class="swing">
    <path d="M53 30a11 11 0 0 1 22 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M42 44l8-12h28l8 12z" fill="currentColor" opacity=".8"/>
    <path d="M44 44h40c5 9 8 20 8 31s-3 20-8 29H44c-5-9-8-18-8-29 0-11 3-22 8-31z" fill="url(#rg)"/>
    <path class="flame" d="M64 60c5 7 11 12 11 19a11 11 0 0 1-22 0c0-5 3-8 5-11 1 3 3 4 4 4 1-4 1-8 2-12z" fill="#fff6d6"/>
    <rect x="40" y="104" width="48" height="9" rx="4" fill="currentColor" opacity=".8"/></g>
</svg>
<h3 id="rtitle"></h3><p id="rsub"></p><div class="rtime" id="rtime"></div>
<div class="actions" style="justify-content:center"><button type="button" class="btn f" id="rok" hidden data-i="close"></button></div></dialog>
<dialog id="ldlg"><form method="dialog" id="lform">
  <h2 data-i="login.title"></h2>
  <label><span data-i="login.user"></span><input name="username" autocomplete="username" required maxlength="40"></label>
  <label><span data-i="login.pass"></span><input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
  <div id="lerr" style="color:var(--bad);min-height:20px"></div>
  <div class="actions"><button class="btn f" data-i="login.go"></button></div>
</form></dialog>
<dialog id="adlg"><form method="dialog" id="aform">
  <h2 data-i="acct.title"></h2>
  <p id="astate" style="color:var(--on2);margin:0 0 8px"></p>
  <label><span data-i="login.user"></span><input name="username" autocomplete="username" required maxlength="40"></label>
  <label><span data-i="acct.new"></span><input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></label>
  <label id="acurl"><span data-i="acct.cur"></span><input name="current" type="password" autocomplete="current-password" maxlength="200"></label>
  <div id="aerr" style="min-height:20px;color:var(--bad)"></div>
  <div class="actions"><button type="button" class="btn" id="aclose" data-i="close"></button><button type="button" class="btn" id="aoff" data-i="acct.off"></button><button type="button" class="btn" id="aout" data-i="acct.out"></button><button class="btn f" data-i="save"></button></div>
</form></dialog>
<dialog id="cdlg">
  <h2 data-i="cat.title"></h2><div id="clist"></div>
  <div class="actions"><button type="button" class="btn" id="cnew" data-i="cat.new"></button><button type="button" class="btn f" id="cclose" data-i="close"></button></div>
</dialog>
<dialog id="kdlg"><form method="dialog" id="kform">
  <h2 id="kt"></h2>
  <label><span data-i="f.name"></span><input name="label" required maxlength="40"></label>
  <div id="klook"></div>
  <div id="kerr" style="color:var(--bad);min-height:20px"></div>
  <div class="actions"><button type="button" class="btn" id="kcancel" data-i="cancel"></button><button class="btn f" data-i="save"></button></div>
</form></dialog>

function lookEditor(host,{fallback,onpaint,resetBoth}){
  host.innerHTML=`<div class="kprev"><span class="lp"></span><input type="color" class="lc" title="${t('color.custom')}"><button type="button" class="btn lr"></button></div>
    <div class="cpal">${COLORS.map(c=>`<button type="button" class="cdot" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>
    <div class="igrid">${Object.keys(ICONS).map(k=>`<button type="button" class="ib" data-ic="${k}" title="${k}">${ico(k)}</button>`).join('')}</div>`;
  const st={icon:'',color:''},q=s=>host.querySelector(s);
  const paint=()=>{const fb=fallback(),icon=st.icon||fb.icon,color=st.color||fb.color;
    q('.lp').innerHTML=badge({icon,color});q('.lc').value=color;q('.lr').textContent=t(resetBoth?'look.reset.dev':'cat.reset');
    host.querySelectorAll('.ib').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ic===icon));
    host.querySelectorAll('.cdot').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===color));
    onpaint&&onpaint(badge({icon,color},1))};
  host.onclick=e=>{const i=e.target.closest('.ib'),c=e.target.closest('.cdot');
    if(i)st.icon=i.dataset.ic;else if(c)st.color=c.dataset.c;else if(e.target.closest('.lr')){st.color='';if(resetBoth)st.icon=''}else return;paint()};
  q('.lc').oninput=e=>{st.color=e.target.value;paint()};
  return {set(i,c){st.icon=i||'';st.color=c||'';paint()},get:()=>({...st}),paint}}

const THEME_VARS=['--bg','--surface','--surface2','--on','--on2','--line','--primary','--on-primary','--pc'];
function applyTheme(){

  THEME_VARS.forEach(v=>root.style.removeProperty(v));
  for(const v in th.vars||{})root.style.setProperty(v,th.vars[v]);

  $('#tmenu').innerHTML=THEMES.map(x=>`<button data-th="${x.id}" aria-pressed="${x===th}"><span>${esc(thLabel(x))}</span>${swatch(x)}</button>`).join('')}

let devices=[],sort={k:'ip',d:1},filt=new Set(),tf=new Set(),lastUpd=null;
const COLS=[['status','col.status'],['name','col.name'],['ip','col.ip'],['mac','col.mac'],['vendor','col.vendor'],['type','col.type'],['reserved','col.assign'],['ports','col.ports'],['notes','col.notes'],['','']];
$('#head').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sort={k,d:sort.k===k?-sort.d:1};render()};
const ipn=ip=>ip?ip.split('.').reduce((a,b)=>a*256+ +b,0):Infinity;
const val=(d,k)=>k==='type'?cats.findIndex(c=>c.key===d.type):k==='ip'?ipn(d.ip):k==='status'?({on:0,conflict:1,off:2}[d.status]??3):d[k];
const PILL={on:['on','st.on'],off:['off','st.off'],conflict:['conflict','st.conflict'],null:['na','st.na']};

const scanning=new Set();
let showPorts=true;try{showPorts=localStorage.getItem('ports')!=='0'}catch{}
const portsCell=d=>{
  if(!showPorts)return d.ports?`<span class="tag" title="${esc(t('pv.has',{p:d.ports.split(',').map(p=>p.replace('/',' ')).join(', ')}))}">${ico('port')}</span>`:`<span class="tag">-</span>`;
  if(!d.scanned_at)return `<span class="tag" title="${t('ports.never')}">-</span>`;
  const p=d.ports?d.ports.split(',').map(p=>{const[n,sv]=p.split('/');return `<span class="tag mono">${esc(n)}${sv?' '+esc(sv):''}</span>`}).join(''):`<span class="tag">${t('ports.none')}</span>`;
  return `<div class="ports" title="${esc(t('ports.scan',{d:d.scanned_at}))}">${p}</div>`};
async function scan(ids){
  ids.forEach(i=>scanning.add(i));$('#scanall').classList.add('spin');render();
  try{const res=ids.length===1?await api('POST',`/api/devices/${ids[0]}/scan`):await api('POST','/api/scan',{ids});
    res.forEach(r=>Object.assign(devices.find(d=>d.id===r.id),r))}
  catch(x){alert(x.message)}
  finally{ids.forEach(i=>scanning.delete(i));$('#scanall').classList.toggle('spin',scanning.size>0);render()}}
function render(){
  const q=$('#q').value.toLowerCase();
  let rows=devices.filter(d=>(!q||[d.name,d.ip,d.mac,d.vendor,d.notes].join(' ').toLowerCase().includes(q))
    &&(!filt.has('on')||d.status==='on'||d.status==='conflict')&&(!filt.has('off')||d.status==='off')&&(!filt.has('conflict')||d.status==='conflict')&&(!filt.has('nores')||(!d.reserved&&d.ip))&&(!tf.size||tf.has(d.type)));
  rows.sort((a,b)=>{const x=val(a,sort.k),y=val(b,sort.k);return (x>y?1:x<y?-1:ipn(a.ip)-ipn(b.ip)||0)*sort.d});
  $('#rows').innerHTML=rows.map(d=>{const[p,l]=PILL[d.status];return `<tr>
    <td><span class="pill ${p}">${t(l)}</span></td>
    <td><div class="name">${devBadge(d)}${esc(d.name)}</div></td>
    <td class="mono">${esc(d.ip)||'-'}</td><td class="mono">${esc(d.mac)}</td><td>${esc(d.vendor)}</td>
    <td>${esc(catLabel(cat(d.type)))}</td>
    <td><span class="tag ${['','r','f'][d.reserved]}">${t('as.'+d.reserved)}</span></td>
    <td>${portsCell(d)}</td>
    <td class="notes">${esc(d.notes)}</td>
    <td style="white-space:nowrap"><button class="icon-btn ${scanning.has(d.id)?'spin':''}" data-s="${d.id}" title="${t('scan.one')}" ${d.ip&&!scanning.has(d.id)?'':'disabled'}>${ico('scan')}</button><button class="icon-btn" data-e="${d.id}" title="${t('act.edit')}">${ico('edit')}</button><button class="icon-btn" data-x="${d.id}" title="${t('act.del')}">${ico('trash')}</button></td></tr>`}).join('');
  const cnt={};devices.forEach(d=>cnt[d.type]=(cnt[d.type]||0)+1);
  $('#types').innerHTML=`<button class="chip ${sort.d<0?'desc':''}" data-sort aria-pressed="${sort.k==='type'}" title="${t('sort.type.t')}">${ico('sort')}${t('sort.type')}</button>`
    +cats.filter(c=>cnt[c.key]).map(c=>`<button class="chip" data-t="${esc(c.key)}" aria-pressed="${tf.has(c.key)}">${badge(c,1)}${esc(catLabel(c))} <small>${cnt[c.key]}</small></button>`).join('')
    +`<button class="chip" data-cats title="${t('cats.btn.t')}">${ico('tag')}${t('cats.btn')}</button><button class="chip" data-rules title="${t('rules.btn.t')}">${ico('rules')}${t('rules.btn')}</button>`
    +`<button class="chip" data-ports title="${t('ports.btn.t')}">${ico('sliders')}${t('ports.btn')}</button><button class="chip" data-pv aria-pressed="${showPorts}" title="${t('pv.t')}">${ico('eye')}${t('pv')}</button>`;
  renderCats();
  const n=s=>devices.filter(d=>d.status===s).length;
  const dyn=devices.filter(d=>!d.reserved&&d.ip).length;  // key: filter set entry; total clears everything
  $('#stats').innerHTML=[['','stat.total',devices.length,'all'],['ok','stat.online',n('on')+n('conflict'),'on'],['bad','stat.off',n('off'),'off'],
    ['warn','stat.conflict',n('conflict'),'conflict'],['','stat.dyn',dyn,'nores']]
    .map(([c,l,v,k])=>`<button class="stat ${c}" data-s="${k}" aria-pressed="${k==='all'?!filt.size&&!tf.size:filt.has(k)}"${k==='conflict'&&!v?' disabled':''}><b>${v}</b><span>${t(l)}</span></button>`).join('');
  if(lastUpd)$('#ts').textContent=t('updated',{t:lastUpd.toLocaleTimeString(lang==='it'?'it-IT':'en-GB')});
}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});
  const j=await r.json();if(r.status===401&&j.error==='login required')showLogin();if(!r.ok)throw new Error(j.error);return j}
async function load(){
  $('#refresh').classList.add('spin');
  try{[devices,cats]=await Promise.all([api('GET','/api/devices'),api('GET','/api/categories')]);lastUpd=new Date();render()}
  finally{$('#refresh').classList.remove('spin')}}
$('#types').onclick=e=>{
  if(e.target.closest('[data-cats]'))return $('#cdlg').showModal();
  if(e.target.closest('[data-pv]')){showPorts=!showPorts;try{localStorage.setItem('ports',showPorts?'1':'0')}catch{}return render()}
  if(e.target.closest('[data-ports]'))return openPorts();
  if(e.target.closest('[data-rules]'))return loadRules().then(()=>$('#rdlg').showModal());
  if(e.target.closest('[data-sort]')){sort={k:'type',d:sort.k==='type'?-sort.d:1};return render()}
  const k=e.target.closest('[data-t]')?.dataset.t;if(!k)return;tf.has(k)?tf.delete(k):tf.add(k);render()};
let runT=null;
async function discover(){
  const b=$('#discover'),d=$('#rundlg'),t0=Date.now();b.classList.add('spin');b.disabled=true;
  d.classList.remove('done');$('#rtitle').textContent=t('run.title');$('#rsub').textContent=t('run.sub');$('#rok').hidden=true;
  const tick=()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rtime').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  tick();runT=setInterval(tick,1000);d.showModal();
  try{const r=await api('POST','/api/discover');await load();$('#rtitle').textContent=t('run.done');$('#rsub').textContent=t('disc.res',{f:r.found,a:r.added})}
  catch(x){$('#rtitle').textContent=t('run.fail');$('#rsub').textContent=x.message}
  finally{clearInterval(runT);d.classList.add('done');$('#rok').hidden=false;$('#rok').focus();b.classList.remove('spin');b.disabled=false}}

$('#rok').onclick=()=>$('#rundlg').close();
$('#import').onclick=()=>$('#impf').click();

let editId=null;const f=$('#form');
const dl=lookEditor($('#dlook'),{resetBoth:true,fallback:()=>{const c=cat(f.type.value);return {icon:c.icon,color:c.color||defColor(c.key)}},onpaint:b=>$('#lookprev').innerHTML=b});
f.type.onchange=()=>dl.paint();
function open(d){fillTypes();editId=d?.id??null;$('#dt').textContent=t(d?'dlg.edit':'dlg.new');$('#err').textContent='';
  for(const k of['name','ip','mac','vendor','type','notes'])f[k].value=d?d[k]:(k==='type'?cat('iot').key:'');
  f.reserved.value=d?.reserved??0;dl.set(d?.icon,d?.color);$('#famrow').hidden=true;$('#fam').checked=false;
  if(d)api('GET',`/api/devices/${d.id}/family`).then(r=>{if(editId!==d.id||!r.count)return;$('#famtxt').textContent=t('fam.apply',{n:r.count,v:r.vendor});$('#famtxt').title=r.names.join(', ');$('#famrow').hidden=false}).catch(()=>{});

$('#add').onclick=()=>open();$('#cancel').onclick=()=>$('#dlg').close();
$('#rows').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s)scan([+b.dataset.s]);

  catch(x){$('#err').textContent=x.message}};

// suggerimento produttore/categoria: mai applicato da solo
let sugN=0,sugData=null;
async function suggest(){
  const n=++sugN,box=$('#sug');
  if(!/^([0-9a-f]{2}:){5}[0-9a-f]{2}$/i.test(f.mac.value.trim())){box.hidden=true;return}
  let s;try{s=await api('POST','/api/suggest',{mac:f.mac.value,name:f.name.value,ports:devices.find(d=>d.id===editId)?.ports||''})}catch{return}
  if(n!==sugN)return;sugData=s;
  const parts=[];
  if(s.vendor&&s.vendor!==f.vendor.value)parts.push(t('sug.vendor',{v:`<b>${esc(s.vendor)}</b>`}));
  if(s.category&&s.category!==f.type.value)parts.push(t('sug.cat',{c:`<b>${esc(catLabel(cat(s.category)))}</b>`,r:esc(s.rule)}));
  box.innerHTML=parts.length?`${t('sug.prefix')} ${parts.join(', ')} <button type="button" class="btn" id="sugok">${t('sug.apply')}</button>`:s.local?esc(t('sug.local')):'';
  box.hidden=!box.innerHTML}
$('#sug').onclick=e=>{if(!e.target.closest('#sugok'))return;
  if(sugData.vendor)f.vendor.value=sugData.vendor;if(sugData.category)f.type.value=sugData.category;suggest()};
f.mac.oninput=suggest;f.name.onchange=suggest;f.vendor.onchange=suggest;f.type.onchange=suggest;

// categorie
const kf=$('#kform');let kKey=null;
const kl=lookEditor($('#klook'),{fallback:()=>({icon:'iot',color:defColor(kKey||'')})});
function kopen(c){kKey=c?.key??null;$('#kt').textContent=t(c?'cat.edit':'cat.new');kf.label.value=c?catLabel(c):'';
  kl.set(c?.icon??'iot',c?.color??'');$('#kerr').textContent='';$('#kdlg').showModal()}
function renderCats(){const n={};devices.forEach(d=>n[d.type]=(n[d.type]||0)+1);
  $('#clist').innerHTML=cats.map(c=>`<div class="crow">${badge(c)}<span class="cl">${esc(catLabel(c))}</span><small>${n[c.key]||0}</small><button class="icon-btn" data-ce="${esc(c.key)}" title="${t('act.edit')}">${ico('edit')}</button><button class="icon-btn" data-cx="${esc(c.key)}" title="${t('act.del')}">${ico('trash')}</button></div>`).join('')}
$('#clist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ce)kopen(cat(b.dataset.ce));
  if(b.dataset.cx&&confirm(t('cat.del.confirm',{n:catLabel(cat(b.dataset.cx))})))try{await api('DELETE','/api/categories/'+b.dataset.cx);load()}catch(x){alert(x.message)}};
$('#cnew').onclick=()=>kopen();$('#cclose').onclick=()=>$('#cdlg').close();$('#kcancel').onclick=()=>$('#kdlg').close();
kf.onsubmit=async e=>{e.preventDefault();
  try{await api(kKey?'PUT':'POST','/api/categories'+(kKey?'/'+kKey:''),{label:kf.label.value,icon:kl.get().icon,color:kl.get().color});$('#kdlg').close();load()}
  catch(x){$('#kerr').textContent=x.message}};

// regole di riconoscimento e database OUI
const fieldOpts=v=>['mac','name','ports','vendor'].map(k=>`<option value="${k}"${k===v?' selected':''}>${t('rf.'+k)}</option>`).join('');
const catOpts=v=>cats.map(c=>`<option value="${esc(c.key)}"${c.key===v?' selected':''}>${esc(catLabel(c))}</option>`).join('');
async function loadRules(){
  const [rules,oui]=await Promise.all([api('GET','/api/rules'),api('GET','/api/oui')]);
  $('#ouiurls').value=oui.urls.join('\n');
  $('#ouiinfo').textContent=oui.count?t('oui.info',{n:oui.count,s:oui.source,d:oui.updated}):t('oui.empty');
  $('#rlist').innerHTML=rules.map(r=>`<div class="rrow" data-id="${r.id}"><select data-k="field">${fieldOpts(r.field)}</select><input data-k="pattern" value="${esc(r.pattern)}" maxlength="60"><select data-k="category">${catOpts(r.category)}</select><button class="icon-btn" data-rx title="${t('act.del')}">${ico('trash')}</button></div>`).join('');
  $('#rnf').innerHTML=fieldOpts('vendor');$('#rnc').innerHTML=catOpts('iot')}
$('#rlist').onchange=async e=>{const row=e.target.closest('.rrow'),g=k=>row.querySelector(`[data-k=${k}]`).value;
  try{await api('PUT','/api/rules/'+row.dataset.id,{field:g('field'),pattern:g('pattern'),category:g('category')})}catch(x){alert(x.message);loadRules()}};
$('#rlist').onclick=async e=>{const b=e.target.closest('[data-rx]');if(!b)return;await api('DELETE','/api/rules/'+b.closest('.rrow').dataset.id);loadRules()};
$('#radd').onclick=async()=>{try{await api('POST','/api/rules',{field:$('#rnf').value,pattern:$('#rnp').value,category:$('#rnc').value});$('#rnp').value='';loadRules()}catch(x){alert(x.message)}};
$('#ouiupd').onclick=async()=>{const b=$('#ouiupd');b.disabled=true;b.textContent=t('oui.busy');
  try{await api('POST','/api/oui/update',{urls:$('#ouiurls').value.split('\n')});await loadRules()}catch(x){alert(x.message)}finally{b.disabled=false;b.textContent=t('oui.update')}};
$('#rclose').onclick=()=>$('#rdlg').close();

// porte della scansione
let pdef='';
const nports=v=>v.split(',').filter(Boolean).reduce((n,p)=>{const[a,b]=p.split('-').map(Number);return n+(b?b-a+1:1)},0);
async function openPorts(){const r=await api('GET','/api/ports');pdef=r.default;$('#pl').value=r.ports;$('#pl').dataset.max=r.max;$('#perr').textContent='';pinfo(r.custom);$('#pdlg').showModal()}
const pinfo=custom=>{const v=$('#pl').value.replace(/\s/g,'');$('#pinfo').textContent=t('ports.info',{n:nports(v),m:$('#pl').dataset.max,k:t(custom??v!==pdef?'ports.custom':'ports.known')})};
$('#pl').oninput=()=>pinfo();
$('#preset').onclick=()=>{$('#pl').value=pdef;pinfo(false)};
$('#pclose').onclick=()=>$('#pdlg').close();
$('#psave').onclick=async()=>{try{await api('PUT','/api/ports',{ports:$('#pl').value});$('#pdlg').close()}catch(x){$('#perr').textContent=x.message}};

// backup e ripristino
const fmtSize=n=>n>1e6?(n/1e6).toFixed(1)+' MB':Math.max(1,Math.round(n/1e3))+' kB';
async function loadBackups(){const r=await api('GET','/api/backups');showBackups(r)}
function showBackups(r){$('#bdir').textContent=r.dir;$('#berr').textContent='';
  $('#blist').innerHTML=r.items.length?r.items.map(b=>`<div class="brow" data-n="${esc(b.name)}" data-d="${esc(b.created)}"><span>${esc(b.created)}<small>${fmtSize(b.size)}</small></span><input data-note value="${esc(b.note)}" maxlength="200" placeholder="${t('bk.note')}"><a class="icon-btn" href="/api/backups/${esc(b.name)}/download" download title="${t('bk.dl')}">${ico('download')}</a><button class="icon-btn" data-rs title="${t('bk.restore')}">${ico('restore')}</button><button class="icon-btn" data-bx title="${t('act.del')}">${ico('trash')}</button></div>`).join(''):`<p style="color:var(--on2)">${t('bk.empty')}</p>`}
const openBackups=()=>loadBackups().then(()=>$('#bdlg').showModal());
const bfail=x=>$('#berr').textContent=x.message;
$('#bnew').onclick=async()=>{try{showBackups(await api('POST','/api/backups',{note:$('#bnote').value}));$('#bnote').value=''}catch(x){bfail(x)}};
$('#blist').onchange=async e=>{const r=e.target.closest('.brow');if(!e.target.matches('[data-note]'))return;try{await api('PUT','/api/backups/'+r.dataset.n,{note:e.target.value})}catch(x){bfail(x)}};
$('#blist').onclick=async e=>{const r=e.target.closest('.brow');if(!r)return;const b=e.target.closest('button');if(!b)return;
  try{if(b.hasAttribute('data-bx')){if(confirm(t('bk.del.confirm',{d:r.dataset.d})))await api('DELETE','/api/backups/'+r.dataset.n);await loadBackups()}
    else if(b.hasAttribute('data-rs')&&confirm(t('bk.restore.confirm',{d:r.dataset.d}))){await api('POST',`/api/backups/${r.dataset.n}/restore`);await load();await loadBackups();alert(t('bk.done'))}}catch(x){bfail(x)}};
$('#bimp').onclick=()=>$('#bfile').click();
$('#bfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const r=await fetch('/api/backups/upload?note='+encodeURIComponent($('#bnote').value||f.name),{method:'POST',body:f});const j=await r.json();if(!r.ok)throw new Error(j.error);showBackups(j);$('#bnote').value=''}catch(x){bfail(x)}};
$('#bkbtn').onclick=openBackups;
$('#bclose').onclick=()=>$('#bdlg').close();

// lingua
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-it]').forEach(e=>e.title=t(e.dataset.it));
  document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
  $('#head').innerHTML=COLS.map(([k,l])=>`<th data-k="${k}">${l?t(l):''}</th>`).join('');
  $('#langbtn').innerHTML=FLAGS[lang];applyTheme();
  $('#lmenu').innerHTML=Object.keys(LANGS).map(k=>`<button data-l="${k}" aria-pressed="${k===lang}">${FLAGS[k]}${LANGS[k]}</button>`).join('');
  $('#xcsv').href='/api/export.csv?lang='+lang;$('#xxlsx').href='/api/export.xlsx?lang='+lang;
  if($('#dlg').open){const v=f.type.value;fillTypes();f.type.value=v;$('#dt').textContent=t(editId?'dlg.edit':'dlg.new');suggest()}
  if($('#rdlg').open)loadRules();
  render()}
$('#langbtn').onclick=e=>{e.stopPropagation();$('#tmenu').hidden=$('#umenu').hidden=true;$('#lmenu').hidden=!$('#lmenu').hidden};
$('#lmenu').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch{}
  $('#lmenu').hidden=true;applyLang()};
$('#ubtn').onclick=e=>{e.stopPropagation();$('#lmenu').hidden=$('#tmenu').hidden=true;$('#mout').hidden=!sess.login;$('#umenu').hidden=!$('#umenu').hidden};
document.addEventListener('click',()=>{$('#lmenu').hidden=$('#tmenu').hidden=$('#umenu').hidden=true});
applyLang();let auto=true;try{auto=localStorage.getItem('auto')!=='0'}catch{}
const setAuto=v=>{auto=v;try{localStorage.setItem('auto',v?'1':'0')}catch{}
  $('#pause').dataset.it=v?'auto.pause':'auto.resume';$('#pause').setAttribute('aria-pressed',!v);
  $('#pause use').setAttribute('href',v?'#i-pause':'#i-play');applyLang()};
$('#pause').onclick=()=>setAuto(!auto);setAuto(auto);
setInterval(()=>{if(auto&&!$('#ldlg').open)load().catch(()=>{})},30000);
let sess={login:false,user:null};
const startApp=()=>load().then(()=>{if({{AUTO}}&&sess.first)discover()}).catch(()=>{});
function showLogin(){if($('#ldlg').open)return;$('#lerr').textContent='';$('#ldlg').showModal();$('#lform').username.focus()}
$('#ldlg').oncancel=e=>e.preventDefault();  // no way around the login
$('#lform').onsubmit=async e=>{e.preventDefault();const f=e.target;
  try{await api('POST','/api/login',{username:f.username.value,password:f.password.value});f.password.value='';$('#ldlg').close();sess=await api('GET','/api/session');startApp()}
  catch(x){$('#lerr').textContent=x.message}};
function acctOpen(){$('#aerr').textContent='';const f=$('#aform');f.password.value=f.current.value='';f.username.value=sess.user||'';
  $('#astate').textContent=sess.login?t('acct.on',{u:sess.user}):t('acct.none');
  $('#acurl').hidden=!sess.login;f.current.required=sess.login;$('#aoff').hidden=$('#aout').hidden=!sess.login;$('#adlg').showModal()}
$('#acct').onclick=acctOpen;$('#aclose').onclick=()=>$('#adlg').close();
$('#aform').onsubmit=async e=>{e.preventDefault();const f=e.target;
  try{await api('POST','/api/account',{username:f.username.value,password:f.password.value,current:f.current.value});sess=await api('GET','/api/session');$('#adlg').close();alert(t('acct.saved'))}
  catch(x){$('#aerr').textContent=x.message}};
$('#aoff').onclick=async()=>{const f=$('#aform');if(!f.current.value)return $('#aerr').textContent=t('acct.cur');if(!confirm(t('acct.off.confirm')))return;
  try{await api('DELETE','/api/account',{current:f.current.value});sess={login:false,user:null};$('#adlg').close()}catch(x){$('#aerr').textContent=x.message}};
$('#aout').onclick=async()=>{await api('POST','/api/logout',{});location.reload()};
$('#mout').onclick=()=>$('#aout').click();
api('GET','/api/session').then(s=>{sess=s;if(!s.login||s.user)startApp();else showLogin()}).catch(()=>{});
</script>
</body>
</html>
